# av.drumfreeexperience.org — MiroTalk SFU reverse proxy
# WebRTC UDP/TCP 40000-40200 goes DIRECT to the VPS IP (Cloudflare DNS-only/grey).
# Only HTTP(S) signaling is proxied here.
server {
    listen 80;
    server_name av.drumfreeexperience.org;
    return 301 https://$host$request_uri;
}
server {
    listen 443 ssl;
    server_name av.drumfreeexperience.org;
    ssl_certificate /etc/letsencrypt/live/av.drumfreeexperience.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/av.drumfreeexperience.org/privkey.pem;

    location / {
        proxy_pass http://localhost:3010;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
    }
}
