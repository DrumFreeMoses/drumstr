<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <linearGradient id="goldGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e8d48b"/>
      <stop offset="100%" stop-color="#d2b356"/>
    </linearGradient>
    <radialGradient id="glowGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#f5a623" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#d2b356" stop-opacity="0"/>
    </radialGradient>
  </defs>
  
  <!-- Transparent background for versatility -->
  
  <!-- Central glow -->
  <circle cx="100" cy="100" r="60" fill="url(#glowGrad)"/>
  
  <!-- Rhythm rings (concentric circles suggesting sound waves) -->
  <circle cx="100" cy="100" r="75" fill="none" stroke="#d2b356" stroke-width="2" opacity="0.3"/>
  <circle cx="100" cy="100" r="55" fill="none" stroke="#d2b356" stroke-width="2.5" opacity="0.5"/>
  <circle cx="100" cy="100" r="35" fill="none" stroke="#d2b356" stroke-width="3" opacity="0.7"/>
  
  <!-- Central drum icon (top-down view) -->
  <circle cx="100" cy="100" r="22" fill="#2c1810"/>
  <circle cx="100" cy="100" r="18" fill="#4a3728"/>
  <circle cx="100" cy="100" r="8" fill="#d2b356"/>
  
  <!-- Drum tension ropes -->
  <g stroke="#e8d48b" stroke-width="1.5" opacity="0.8">
    <line x1="100" y1="78" x2="100" y2="82"/>
    <line x1="100" y1="118" x2="100" y2="122"/>
    <line x1="78" y1="100" x2="82" y2="100"/>
    <line x1="118" y1="100" x2="122" y2="100"/>
    <line x1="84" y1="84" x2="87" y2="87"/>
    <line x1="113" y1="113" x2="116" y2="116"/>
    <line x1="84" y1="116" x2="87" y2="113"/>
    <line x1="113" y1="87" x2="116" y2="84"/>
  </g>
</svg>
