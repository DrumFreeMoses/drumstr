<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <linearGradient id="goldGrad3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e8d48b"/>
      <stop offset="100%" stop-color="#d2b356"/>
    </linearGradient>
    <linearGradient id="energyGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#d2b356"/>
      <stop offset="100%" stop-color="#f5a623"/>
    </linearGradient>
  </defs>
  
  <!-- Abstract "D" monogram for Drumstr -->
  
  <!-- Vertical stroke -->
  <rect x="45" y="40" width="18" height="120" rx="4" fill="url(#goldGrad3)"/>
  
  <!-- Curved stroke (the D bowl) -->
  <path d="M 63 40 L 100 40 Q 155 40 155 100 Q 155 160 100 160 L 63 160" 
        fill="none" 
        stroke="url(#goldGrad3)" 
        stroke-width="18"
        stroke-linecap="round"
        stroke-linejoin="round"/>
  
  <!-- Energy pulse lines through the D -->
  <g stroke="url(#energyGrad)" stroke-width="3" stroke-linecap="round" opacity="0.9">
    <line x1="54" y1="70" x2="146" y2="70"/>
    <line x1="54" y1="85" x2="155" y2="85"/>
    <line x1="54" y1="100" x2="160" y2="100"/>
    <line x1="54" y1="115" x2="155" y2="115"/>
    <line x1="54" y1="130" x2="146" y2="130"/>
  </g>
  
  <!-- Rhythm dots -->
  <g fill="#f5a623">
    <circle cx="175" cy="70" r="4"/>
    <circle cx="180" cy="85" r="5"/>
    <circle cx="185" cy="100" r="6"/>
    <circle cx="180" cy="115" r="5"/>
    <circle cx="175" cy="130" r="4"/>
  </g>
</svg>
